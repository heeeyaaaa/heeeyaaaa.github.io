<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 148" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="148" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="28" y="30" font-size="15" font-weight="600" fill="#1a1a1a">Opening one crafted note file runs a shell command</text>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <path d="M152 88H171" marker-end="url(#arrow)"/>
    <path d="M297 88H316" marker-end="url(#arrow)"/>
    <path d="M442 88H461" marker-end="url(#arrow)"/>
    <path d="M587 88H606" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle">
    <rect x="28" y="52" width="124" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="90" y="76" font-weight="600" fill="#1a1a1a">evil.serial</text>
    <text x="90" y="94" font-size="11.5" fill="#555555">picked in the</text>
    <text x="90" y="110" font-size="11.5" fill="#555555">document picker</text>

    <rect x="173" y="52" width="124" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="235" y="76" font-weight="600" fill="#1a1a1a">openFile()</text>
    <text x="235" y="94" font-size="11.5" fill="#555555">path sent to</text>
    <text x="235" y="110" font-size="11.5" fill="#555555">native module</text>

    <rect x="318" y="52" width="124" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="380" y="76" font-weight="600" fill="#1a1a1a">Unarchiver</text>
    <text x="380" y="94" font-size="11.5" fill="#555555">no secure coding</text>
    <text x="380" y="110" font-size="11.5" fill="#555555">builds [Note]</text>

    <rect x="463" y="52" width="124" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="525" y="76" font-weight="600" fill="#1a1a1a">Note.os</text>
    <text x="525" y="94" font-size="11.5" fill="#555555">newlines removed</text>
    <text x="525" y="110" font-size="11.5" fill="#555555">dropped in grep</text>

    <rect x="608" y="52" width="124" height="72" rx="8" fill="#2f6fdf" fill-opacity="0.12" stroke="#2f6fdf" stroke-width="2"/>
    <text x="670" y="76" font-weight="600" fill="#1a1a1a">/bin/sh -c</text>
    <text x="670" y="94" font-size="11.5" fill="#1a1a1a">runs payload as</text>
    <text x="670" y="110" font-size="11.5" fill="#1a1a1a">uid 501 mobile</text>
  </g>
</svg>
